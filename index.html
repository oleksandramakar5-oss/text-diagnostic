                if (lvl === activeLevel) {
                    if (lvl === 'low') {
                        btn.className = 'level-btn border-2 p-2 rounded-lg text-center transition flex flex-col items-center justify-center border-amber-500 bg-amber-50 text-amber-900 shadow-sm';
                    } else if (lvl === 'mid') {
                        btn.className = 'level-btn border-2 p-2 rounded-lg text-center transition flex flex-col items-center justify-center border-blue-500 bg-blue-50 text-blue-900 shadow-sm';
                    } else {
                        btn.className = 'level-btn border-2 p-2 rounded-lg text-center transition flex flex-col items-center justify-center border-emerald-500 bg-emerald-50 text-emerald-900 shadow-sm';
                    }
                } else {
                    btn.className = 'level-btn border border-slate-200 bg-white text-slate-600 hover:border-slate-300 p-2 rounded-lg text-center transition flex flex-col items-center justify-center';
                }
            });
        }

        function updateAll() {
            updateLevelUI();
            const currentSub = SUBJECTS.find(s => s.id === selectedSubject);
            const rawTestData = inputTestData.value.trim();
            const linkUrl = inputLink.value.trim();
            const diagText = TEXTS[selectedSubject] ? TEXTS[selectedSubject][activeLevel] : '';

            let outputParts = [];

            outputParts.push(`${currentSub.emoji} ${currentSub.name}`);

            if (rawTestData) {
                outputParts.push(rawTestData);
            }

            if (linkUrl) {
                outputParts.push(linkUrl);
            }

            if (diagText) {
                outputParts.push(diagText);
            }

            finalOutputTextarea.value = outputParts.join('\n\n');
        }

        function copyTextToClipboard(text, msg = 'Текст успішно скопійовано!') {
            if (!text) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => showToast(msg));
            } else {
                // Fallback for copy execution in nested iframe environments
                const dummy = document.createElement("textarea");
                document.body.appendChild(dummy);
                dummy.value = text;
                dummy.select();
                document.execCommand("copy");
                document.body.removeChild(dummy);
                showToast(msg);
            }
        }

        function showToast(msg) {
            toastMessage.textContent = msg;
            toast.classList.remove('translate-y-16', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-16', 'opacity-0');
            }, 2200);
        }

        function resetForm() {
            inputTestData.value = '';
            inputLink.value = '';
            score = null;
            detectedScoreEl.textContent = '—';
            manualScoreInput.value = '';
            isLevelManuallyOverridden = false;
            activeLevel = 'low';
            updateAll();
        }

        window.onload = function() {
            init();
        };
    </script>
</body>
</html>
